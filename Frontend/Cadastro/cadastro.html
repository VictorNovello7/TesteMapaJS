<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Vendedores - Wade Brasil</title>
    <link rel="stylesheet" href="cadastro.css">
    <style>
        .cadastro-card {
            width: 100%;
            max-width: 480px;
        }
    </style>
</head>
<body>

    <!-- Menu Superior -->
    <nav class="navbar">
        <div class="brand-logo">
            <img src="logo-wade.webp" alt="">
        </div>
        </a>
        <ul class="nav-links">
            <li><a href="#">marcas</a></li>
            <li><a href="#">produtos</a></li>
            <li><a href="#">historia</a></li>
            <li><a href="consulta.html" class="active">duvidas</a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <div class="hero-logo">
            <img src="LogoWadeColorida.png" alt="Logo wade">
        </div>

        <div class="card-box cadastro-card">
            <h1 class="card-title">Cadastro de Vendedores</h1>
            
            <form id="cadastroForm">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" class="form-input" placeholder="Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="username@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" class="form-input" placeholder="(00) 00000-0000" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" class="form-input" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" class="form-input" placeholder="00000-000" required>
                </div>

                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </div>
    </main>

    <script>
        // Formatação simples de máscaras
        document.getElementById('cpf').addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });

        document.getElementById('cep').addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            e.target.value = v;
        });

        // Evento do Formulário
        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const telefone = document.getElementById('telefone').value;
    const cpf = document.getElementById('cpf').value;
    const cep = document.getElementById('cep').value;

    try {
        const resposta = await fetch('http://localhost:3000/vendedores', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nome,
                email,
                telefone,
                cpf,
                cep
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro);
            return;
        }

        alert('Vendedor cadastrado com sucesso!');
        window.location.href = "../consulta/consulta.html";

    } catch (erro) {
        console.error(erro);
        alert('Não foi possível conectar ao servidor.');
    }
});
    </script>
</body>
</html>
