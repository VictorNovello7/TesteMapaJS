
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Vendedores - Wade Brasil</title>
    <link rel="stylesheet" href="consulta.css">
    <style>
        .consulta-card {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <!-- Menu Superior -->
    <nav class="navbar">
        <img class="img1" src="logo-wade.webp">
        <ul class="nav-links">
            <li><a href="" class="active">Voltar</a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <div class="hero-logo">
            <img class="img2" src="wadeFundoTrp.png">
        </div>

        <div class="card-box consulta-card">
            <h1 class="card-title">Consultar vendedores</h1>
            
            <form id="consultaForm">
                <div class="form-group">
                    <label for="cepConsulta">CEP</label>
                    <input type="text" id="cepConsulta" class="form-input" placeholder="00000-000" required>
                </div>

                <button type="submit" class="btn-submit">Buscar</button>
            </form>
        </div>
    </main>

    <script>
    document.getElementById('cepConsulta').addEventListener('input', function(e) {
        let v = e.target.value.replace(/\D/g, '');
        v = v.replace(/^(\d{5})(\d)/, '$1-$2');
        e.target.value = v;
    });

    document.getElementById('consultaForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const cep = document.getElementById('cepConsulta').value;

    if (!cep) {
        alert('Digite um CEP.');
        return;
    }

    try {
        const resposta = await fetch(
            `http://localhost:3000/localizar/${cep}`
        );

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro);
            return;
        }

        // Vai para a página de resultado
        window.location.href =
            `http://localhost:3000/resultado/resultado.html?cep=${encodeURIComponent(cep)}`;

    } catch (erro) {
        console.error(erro);
        alert('Erro ao conectar com o servidor.');
    }
});
</script>
</body>
</html>
